# Scenario: full-stack queueing of a GitHub-native stack
# (GITHUB_STACK_QUEUE_FOR_ORGS). Walkthrough:
# scenarios/github-native-stack-full-queue/README.md
#
# No `merge_queue:` block ON PURPOSE — the defaults are what this scenario wants:
#
# - max_parallel_checks defaults to 5, which is what keeps checks in DRAFT mode.
#   INPLACE mode rebases the user PR's own branch, and GitHub refuses that for a
#   stack member ("Updating a stacked PR's branch via this endpoint is not
#   supported"); DRAFT builds via POST /merges, unfenced since stacks went to
#   public preview, and never touches the member's branch. `should_run_checks_inplace`
#   needs max_parallel_checks == 1 among other things, so the default alone
#   guarantees DRAFT.
# - Spelling `mode: parallel` here would additionally require `scopes.source`,
#   which this scenario has no use for.
#
# merge_conditions gates on the repo's own `ci` workflow (.github/workflows), so
# the bottom does not merge the instant it embarks -- an empty merge_conditions
# merges on embark and races the survivor's own queue entry, which is exactly the
# state this scenario exists to observe.
#
# autoqueue is what makes `queue_conditions` actually admit a pull request without
# a `pull_request_rules` queue action (which would need the workflow_automation
# product). It is also load-bearing for the observation: after a restack dequeues
# a survivor, autoqueue RE-ADMITS it, which is the churn half of the prediction --
# with command-only entry the survivor would simply stay out and we would only see
# half the cycle.
queue_rules:
  - name: default
    queue_conditions:
      - "label=queue"
    merge_conditions:
      - "check-success=ci"
    batch_size: 3
    merge_method: squash

  # scenarios/failing-check-attribution. Only a `checks-demo` label routes a PR
  # here, so the stack scenarios above are unaffected. `security-scan` is a
  # commit status the scenario script posts; it sits in queue_conditions, which
  # are evaluated on the user PR, while `ci` runs on the draft -- that split is
  # what the scenario needs to show which of the two gets blamed.
  - name: checks-demo
    queue_conditions:
      - "label=checks-demo"
      - "check-success=security-scan"
    merge_conditions:
      - "check-success=ci"
    merge_method: squash

  # scenarios/changed-files-from-git. A probe for CHANGED_FILES_FROM_GIT_FOR_ORGS
  # (MRGFY-7706). GitHub's GET /pulls/{n}/files stops at 3 000 entries with no
  # error, while `changed_files` stays accurate; above the cap the engine now
  # lists the changed files with `git diff` instead.
  #
  # The scenario's pull request changes 3 501 files, and `zzz-past-the-cap.txt`
  # sorts last, so GitHub's truncated list provably cannot contain it. The first
  # condition is the control -- `bulk/f0001.txt` is entry 1 and matches either
  # way. So the rule admits the pull request only if the engine is reading the
  # complete list.
  #
  # `manual-gate` is a commit status nobody posts: the probe enters the queue and
  # stays there, which is the whole observation. Drop the label to dequeue it.
  - name: bigdiff-probe
    queue_conditions:
      - "label=bigdiff-probe"
      - "files=bulk/f0001.txt"
      - "files=zzz-past-the-cap.txt"
    merge_conditions:
      - "check-success=manual-gate"
merge_protections_settings:
  auto_merge_conditions: true
