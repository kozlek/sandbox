# Scenario: full-stack queueing of a GitHub-native stack
# (GITHUB_STACK_QUEUE_FOR_ORGS). Walkthrough:
# scenarios/github-native-stack-full-queue/README.md
#
# No `merge_queue:` block ON PURPOSE — the defaults are what this scenario wants:
#
# - max_parallel_checks defaults to 5, which is what keeps checks in DRAFT mode.
#   INPLACE mode rebases the user PR's own branch, and GitHub refuses that for a
#   stack member ("Updating a stacked PR's branch via this endpoint is not
#   supported"); DRAFT builds via POST /merges, unfenced since stacks went to
#   public preview, and never touches the member's branch. `should_run_checks_inplace`
#   needs max_parallel_checks == 1 among other things, so the default alone
#   guarantees DRAFT.
# - Spelling `mode: parallel` here would additionally require `scopes.source`,
#   which this scenario has no use for.
#
# merge_conditions gates on the repo's own `ci` workflow (.github/workflows), so
# the bottom does not merge the instant it embarks -- an empty merge_conditions
# merges on embark and races the survivor's own queue entry, which is exactly the
# state this scenario exists to observe.
queue_rules:
  - name: default
    queue_conditions:
      - "label=queue"
    merge_conditions:
      - "check-success=ci"
    batch_size: 1
    merge_method: squash
